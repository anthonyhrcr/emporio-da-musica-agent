[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música (Artefact AI Engineer case)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
emporio = "emporio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
